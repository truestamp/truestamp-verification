# https://taskfile.dev
#
# Tool versions come from .tool-versions, which mise reads: Erlang, Elixir and this
# runner. `task bootstrap` installs them. The Elixir reference verifier is the Mix
# project in elixir/, so its tasks run there. Its .formatter.exs and .credo.exs also take in
# the scripts in generator/ and agent-test/, so format, format-check and credo cover them.

version: "3"

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list-all

  # ===========================================================================
  # Setup
  # ===========================================================================

  bootstrap:
    desc: First-time setup. Installs the tools in .tool-versions with mise, then runs setup.
    cmds:
      - task: mise-install
      - task: setup

  mise-install:
    desc: Install the tool versions in .tool-versions (Erlang, Elixir, task), prebuilt only
    env:
      # Fail rather than compile Erlang from source when no prebuilt build exists.
      MISE_ERLANG_COMPILE: "false"
    cmds:
      - mise install
      - mise ls --current

  setup:
    desc: Fetch the reference verifier's dependencies
    aliases: [deps]
    dir: elixir
    cmds:
      - mix local.hex --force --if-missing
      - mix local.rebar --force --if-missing
      - mix deps.get

  # ===========================================================================
  # Everyday
  # ===========================================================================

  compile:
    desc: Compile the reference verifier, with warnings as errors
    dir: elixir
    env:
      MIX_ENV: test
    cmds:
      - mix compile --warnings-as-errors

  format:
    desc: Format the Elixir sources, the scripts in generator/ and agent-test/ included
    dir: elixir
    cmds:
      - mix format

  format-check:
    desc: Fail if any Elixir source, generator/ and agent-test/ included, is not formatted, without changing it
    dir: elixir
    cmds:
      - mix format --check-formatted

  credo:
    desc: Run credo in strict mode over the Elixir sources, generator/ and agent-test/ included
    dir: elixir
    cmds:
      - mix credo --strict

  test:
    desc: Run the reference verifier's tests
    dir: elixir
    cmds:
      # UTF-8 file names in any locale, as on macOS: a test runs the verifier in the C locale.
      # Set in the command, since Task lets a caller's ELIXIR_ERL_OPTIONS override a task env.
      - ELIXIR_ERL_OPTIONS="+fnu ${ELIXIR_ERL_OPTIONS:-}" mix test --warnings-as-errors {{.CLI_ARGS}}

  style:
    desc: "Fail on a house-style slip: an em dash, a retired term, a versioned format name, or a BCP 14 key word outside SPEC.md"
    silent: true
    cmds:
      # The files git tracks or would track, so .gitignore alone decides what is skipped.
      # A check fails when grep prints a line, whatever its exit status. Each pattern hides
      # one letter in brackets so it cannot match its own line.
      - |
        rc=0
        if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          echo "style: not inside a git working tree, so no file was checked"; exit 1
        fi
        # .claude/skills/ holds third-party skills kept exactly as published, so their own
        # style is theirs (.claude/skills/SOURCES.md).
        files() { git ls-files -z --cached --others --exclude-standard -- "$@" ':!:.claude/skills/**'; }
        report() {
          if [ -n "$1" ]; then echo "$1"; echo "style: $2"; rc=1; fi
        }
        report "$(files . | xargs -0 grep -s -H -n -I -F "$(printf '\342\200\224')" -- || true)" \
          "an em dash; use a hyphen or rewrite the sentence"
        report "$(files . | xargs -0 grep -s -H -n -I -i -E '\banch[o]r|temporal[ -]?(br[a]cket|w[i]ndow|b[o]und)|(verified|forensic)[ -]time[ -]w[i]ndow' -- || true)" \
          "a retired term; say commit or commitment, and submission window"
        report "$(files . | xargs -0 grep -s -H -n -I -i -E '\b[a-z0-9]+(-[a-z0-9]+)*-v[0-9]+\b|\b(proof|format|bundle|envelope|specification)[ _-]?v[0-9]+\b' -- || true)" \
          "a version-numbered format name"
        report "$(files . ':!:SPEC.md' | xargs -0 grep -s -H -n -I -E '\b(M[U]ST|REQ[U]IRED|SH[A]LL|SH[O]ULD|RECOMM[E]NDED|M[A]Y|OPT[I]ONAL)\b' -- || true)" \
          "a BCP 14 key word outside SPEC.md"
        exit $rc

  # ===========================================================================
  # The vectors
  # ===========================================================================

  generate:
    desc: Write the files under vectors/ and agent-test/ with the generator, then both manifests
    cmds:
      - elixir generator/generate.exs
      - task: manifest

  generate-check:
    desc: Run the generator's checks, and fail if vectors/ or agent-test/ differs from what task generate writes
    cmds:
      - elixir generator/generate.exs --check

  # ===========================================================================
  # The agent-sufficiency test (SPEC.md 7.4)
  # ===========================================================================

  agent-test-check:
    desc: "Hold the agent-test harness to its known-good script and its flawed copies (check.exs --self-test)"
    cmds:
      - elixir agent-test/check.exs --self-test

  agent-test:
    desc: "Judge a session's verify.py on its fixture's runs: task agent-test -- PATH/TO/verify.py --only FIXTURE --python PATH/TO/python3"
    cmds:
      - elixir agent-test/check.exs {{.CLI_ARGS}}

  # ===========================================================================
  # The manifests
  # ===========================================================================

  manifest:
    desc: Rewrite MANIFEST.sha256, over spec/ and vectors/, and agent-test/MANIFEST.sha256, over agent-test/ but results/
    cmds:
      - elixir generator/manifest.exs

  manifest-check:
    desc: Fail if MANIFEST.sha256 or agent-test/MANIFEST.sha256 differs from what task manifest writes
    cmds:
      - elixir generator/manifest.exs --check

  # ===========================================================================
  # Gates
  # ===========================================================================

  precommit:
    desc: "Format, then every gate `task check` runs"
    cmds:
      - task: format
      - task: gates

  check:
    desc: The CI gate. Like precommit, but checks formatting instead of changing files.
    cmds:
      - task: format-check
      - task: gates

  gates:
    internal: true
    cmds:
      - task: style
      - task: generate-check
      - task: agent-test-check
      - task: manifest-check
      - task: compile
      - task: credo
      - cd elixir && mix deps.unlock --check-unused
      - task: test
